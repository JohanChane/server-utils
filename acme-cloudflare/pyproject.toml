[project]
name = "acme-cf"
version = "0.1.0"
description = "ACME SSL certificate management with Cloudflare DNS"
requires-python = ">=3.10"

[project.scripts]
acme-cf = "acme_cf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["I"]
