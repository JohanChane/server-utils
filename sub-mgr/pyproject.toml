[project]
name = "sub-mgr"
version = "0.1.0"
description = "订阅配置转换工具"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0",
]
authors = [
    { name = "SubMgr Developer" },
]
license = { text = "MIT" }

[project.scripts]
sub-mgr = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# These CLI helpers report failures and continue processing other subscriptions.
"sub_mgr/core/proxy_restorer.py" = ["BLE001"]
"sub_mgr/core/sub_mgr.py" = ["BLE001"]
